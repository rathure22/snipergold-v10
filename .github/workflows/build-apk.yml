name: Build APK FIXED V4 - 2026 No Tools Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 No Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova 12
        run: npm install -g cordova@12

      - name: Install project deps
        run: npm install --no-package-lock

      - name: Add Android Platform 14
        run: |
          cordova platform rm android || true
          cordova platform add android@14 --save

      - name: Build APK Debug
        run: cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SniperGold-v10-FIXED-APK-V4
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
